name: Database Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"

permissions:
  contents: read

jobs:
  database:
    name: Supabase database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - name: Start local Supabase
        run: supabase start
      - name: Replay migrations and seed
        run: supabase db reset
      - name: Lint database functions
        run: supabase db lint --level error --fail-on error
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
